name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Nuitka extras
        run: uv add "nuitka[onefile]"

      # Linux/macOS
      - name: Build Unix
        if: runner.os != 'Windows'
        run: |
          uv run python -m nuitka \
            --standalone \
            --python-flag=-m \
            --output-filename=crow-client \
            src/client

      # Windows
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run python -m nuitka `
            --standalone `
            --python-flag=-m `
            --output-filename=crow-client `
            src/client

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crow-client-${{ runner.os }}
          path: |
            *.exe
            *.bin
            crow-client
