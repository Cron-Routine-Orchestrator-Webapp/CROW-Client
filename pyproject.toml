[project]
name = "crow-client"
version = "1.0.0"
description = "CROW-Client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncio>=4.0.0",
    "pydantic>=2.13.4",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.5.0",
]

[project.scripts]
client = "client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.15",
    "pre-commit>=4.6.0",
]
